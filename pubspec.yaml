name: omr_parent_app
description: "Parent app for OMR school test reports (Firestore + n8n reminders)."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^4.0.0
  firebase_auth: ^6.0.0
  cloud_firestore: ^6.0.0
  firebase_messaging: ^16.0.0
  flutter_local_notifications: ^18.0.1
  google_sign_in: ^7.1.0
  url_launcher: ^6.3.0
  fl_chart: ^0.69.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

# NOTE: the version numbers above are a known-compatible set, but the Firebase
# plugins are released together and move fast. The most reliable way to get a
# consistent set is to let pub resolve them:
#
#   flutter pub add firebase_core firebase_auth cloud_firestore \
#                   firebase_messaging google_sign_in url_launcher
#
# If a build fails on version conflicts, run:  flutter pub upgrade --major-versions
